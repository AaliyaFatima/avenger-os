<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avenger OS Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050914; 
            --glass-bg: rgba(20, 25, 35, 0.4); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00e5ff; 
            --accent-blue: #2979ff; 
            --danger: #ff1744; 
            --success: #00e676;
            --warning: #ffea00; 
            --text-main: #ffffff; 
            --text-muted: #7889a5;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0d1627 0%, var(--bg-dark) 100%);
            color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; 
            padding: 20px; 
            min-height: 100vh; display: flex; justify-content: center; user-select: none;
        }

        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; } 

        .header-row { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; letter-spacing: 2px; margin: 0; } 
        h1 span { color: var(--accent-cyan); text-shadow: 0 0 12px var(--accent-cyan); }
        .status-pill { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 8px 18px; border-radius: 30px; font-size: 13px; font-weight: 800; letter-spacing: 1px; } 
        .status-pill.online { color: var(--success); box-shadow: 0 0 15px rgba(0,230,118,0.2); border-color: rgba(0,230,118,0.4); }

        .center-dash {
            background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 45px 25px 35px 25px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
        }

        .gear-display { font-family: 'Orbitron'; font-size: 80px; font-weight: 900; line-height: 1; color: var(--text-muted); transition: 0.3s; } 
        .gear-display.neutral { color: var(--success); text-shadow: 0 0 40px rgba(0,230,118,0.4); }
        .gear-label { font-size: 12px; color: var(--text-muted); letter-spacing: 3px; font-weight: 800; margin-top: 10px; } 

        .badge-btn {
            position: absolute; top: 18px; border: 1px solid var(--glass-border);
            padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        } 
        #ecoBtn { right: 18px; }
        #ecoBtn.active { background: rgba(0,230,118,0.1); border-color: var(--success); color: var(--success); box-shadow: 0 0 15px rgba(0,230,118,0.2); }

        #alarmBtn { left: 18px; }
        #alarmBtn.active { background: rgba(255,23,68,0.1); border-color: var(--danger); color: var(--danger); box-shadow: 0 0 15px rgba(255,23,68,0.3); }

        .eco-warning-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,23,68,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10;
        }
        .eco-warning-overlay.show { opacity: 1; pointer-events: all; }
        .eco-timer { font-family: 'Orbitron'; font-size: 80px; font-weight: 900; color: #fff; } 
        .eco-warning-text { font-size: 16px; font-weight: 800; letter-spacing: 2px; color: #000; }

        .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } 
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; justify-content: center;} 
        .label { font-size: 12px; color: var(--text-muted); letter-spacing: 1.5px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .readout { font-family: 'Orbitron', sans-serif; font-size: 28px; color: #fff; margin: 12px 0; } 
        .unit { font-size: 13px; color: var(--text-muted); }
        .progress-track { background: rgba(0,0,0,0.5); height: 6px; border-radius: 6px; overflow: hidden; margin-top: 5px; } 
        .progress-fill { background: var(--accent-cyan); height: 100%; width: 100%; transition: 1s; box-shadow: 0 0 12px var(--accent-cyan); }

        /* NEW BATTERY PANEL */
        .battery-panel { margin-top: -5px; }
        .battery-readout { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--accent-blue); margin: 12px 0; transition: color 0.3s;}
        
        .trip-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: -5px; }
        .trip-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 18px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .trip-panel .label { font-size: 10px; letter-spacing: 2px; }
        .trip-val { font-family: 'Orbitron'; font-size: 18px; font-weight: 700; color: #fff; margin-top: 5px; }
        .trip-val span.unit { font-size: 10px; color: var(--accent-cyan); }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-top: 5px; }
        .control-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 26px; padding: 45px 0; display: flex; justify-content: center; align-items: center; transition: 0.3s; cursor: pointer; } 
        .control-btn i { font-size: 42px; color: #3a4b66; transition: 0.3s; } 
        
        .active-ignition { background: rgba(0,230,118,0.15); border-color: var(--success); box-shadow: inset 0 0 15px rgba(0,230,118,0.2), 0 0 20px rgba(0,230,118,0.2); } 
        .active-ignition i { color: var(--success); text-shadow: 0 0 20px var(--success), 0 0 45px var(--success); }
        
        .active-lights { background: rgba(0,229,255,0.15); border-color: var(--accent-cyan); box-shadow: inset 0 0 15px rgba(0,229,255,0.2), 0 0 20px rgba(0,229,255,0.2); } 
        .active-lights i { color: var(--accent-cyan); text-shadow: 0 0 20px var(--accent-cyan), 0 0 45px var(--accent-cyan); }
        
        .active-start { background: rgba(255,23,68,0.15); border-color: var(--danger); box-shadow: inset 0 0 15px rgba(255,23,68,0.2), 0 0 20px rgba(255,23,68,0.2); } 
        .active-start i { color: #fff; text-shadow: 0 0 20px var(--danger), 0 0 45px var(--danger); }
        
        .active-horn { background: rgba(255,234,0,0.15); border-color: var(--warning); box-shadow: inset 0 0 15px rgba(255,234,0,0.2), 0 0 20px rgba(255,234,0,0.2); } 
        .active-horn i { color: #fff; text-shadow: 0 0 20px var(--warning), 0 0 45px var(--warning); }

        .connect-btn { width: 100%; padding: 22px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; border-radius: 24px; cursor: pointer; font-family: 'Orbitron'; font-size: 18px; letter-spacing: 2px; font-weight: 700; transition: 0.3s; } 
        .connect-btn:hover { background: rgba(255,255,255,0.1); }
        .debug-console { text-align: center; font-family: monospace; font-size: 11px; color: var(--warning); min-height: 15px; margin-top: 5px; letter-spacing: 0.5px;}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-row">
            <h1>AVENGER<span>.OS</span></h1>
            <div id="statusPill" class="status-pill">OFFLINE</div>
        </div>

        <div class="center-dash">
            <div id="alarmBtn" class="badge-btn" onclick="toggleAlarm()">ALARM OFF</div>
            <div id="ecoBtn" class="badge-btn" onclick="toggleEcoMode()">ECO OFF</div>
            
            <div id="gearVal" class="gear-display">-</div>
            <div class="gear-label">GEAR POSITION</div>
            
            <div id="ecoWarning" class="eco-warning-overlay">
                <div class="eco-warning-text">AUTO-STOP IN</div>
                <div id="ecoTimerDisplay" class="eco-timer">10</div>
            </div>
        </div>

        <div class="dash-row">
            <div class="glass-panel">
                <div class="label">
                    <span>SERVICE DUE</span>
                    <i class="fa-solid fa-rotate-right" onclick="resetService()" style="cursor:pointer; color: var(--accent-cyan); font-size: 16px; padding: 5px;"></i>
                </div>
                <div class="readout"><span id="serviceVal">---</span> <span class="unit">KM</span></div>
                <div class="progress-track"><div class="progress-fill" id="serviceBar"></div></div>
            </div>
            <div class="glass-panel">
                <div class="label">ENGINE TEMP</div>
                <div class="readout" style="color:var(--accent-blue)"><span id="tempDigit">--</span> <span class="unit">°C</span></div>
                <div class="progress-track"><div class="progress-fill" id="tempBar" style="background:var(--accent-blue); width:0%;"></div></div>
            </div>
        </div>

        <!-- NEW BATTERY HEALTH MONITOR -->
        <div class="glass-panel battery-panel">
            <div class="label">BATTERY HEALTH 
                <i class="fa-solid fa-bolt" style="color: var(--warning);"></i>
            </div>
            <div class="battery-readout"><span id="battDigit">--.-</span> <span class="unit">V</span></div>
            <div class="progress-track"><div class="progress-fill" id="battBar" style="background:var(--accent-blue); width:0%;"></div></div>
        </div>

        <!-- TRIP COMPUTER UI -->
        <div class="trip-row">
            <div class="trip-panel">
                <div class="label">DAY</div>
                <div class="trip-val"><span id="valDay">0.0</span> <span class="unit">KM</span></div>
            </div>
            <div class="trip-panel">
                <div class="label">WEEK</div>
                <div class="trip-val"><span id="valWeek">0.0</span> <span class="unit">KM</span></div>
            </div>
            <div class="trip-panel">
                <div class="label">MONTH</div>
                <div class="trip-val"><span id="valMonth">0.0</span> <span class="unit">KM</span></div>
            </div>
        </div>

        <button id="connectBtn" class="connect-btn">INITIALIZE LINK</button>
        <div id="debugStr" class="debug-console">SYS: STANDBY</div>

        <div class="controls-grid">
            <div class="control-btn" id="ignCard" onclick="toggleIgnition()"><i class="fa-solid fa-power-off"></i></div>
            <div class="control-btn" id="lightCard" onclick="toggleLights()"><i class="fa-solid fa-sun"></i></div>
            <div class="control-btn" onmousedown="handleHold('S','active-start',true)" onmouseup="handleHold('s','active-start',false)" ontouchstart="handleHold('S','active-start',true); event.preventDefault();" ontouchend="handleHold('s','active-start',false); event.preventDefault();"><i class="fa-solid fa-bolt"></i></div>
            <div class="control-btn" onmousedown="handleHold('H','active-horn',true)" onmouseup="handleHold('h','active-horn',false)" ontouchstart="handleHold('H','active-horn',true); event.preventDefault();" ontouchend="handleHold('h','active-horn',false); event.preventDefault();"><i class="fa-solid fa-volume-high"></i></div>
        </div>
    </div>

    <script>
        const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const rxUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const txUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a9";
        
        let bleDevice, rxChar, isIgnitionOn = false;
        let isWriting = false, commandQueue = [];
        let dataBuffer = "";

        let isEcoMode = false;
        let ecoTimerInterval = null;
        let countdown = 10;
        let hasRiddenSession = false; 
        let isAlarmArmed = false;

        let lastServiceKm = null;

        const connectBtn = document.getElementById('connectBtn');
        const statusPill = document.getElementById('statusPill');
        const debugStr = document.getElementById('debugStr');
        const ecoWarning = document.getElementById('ecoWarning');
        const ecoTimerDisplay = document.getElementById('ecoTimerDisplay');

        // Trip Computer Logic
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        function checkTripDates() {
            let now = new Date();
            let todayStr = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
            let weekStr = now.getFullYear() + "-W" + getWeekNumber(now);
            let monthStr = now.getFullYear() + "-" + now.getMonth();

            if(localStorage.getItem('currentDay') !== todayStr) { localStorage.setItem('currentDay', todayStr); localStorage.setItem('tripDay', '0'); }
            if(localStorage.getItem('currentWeek') !== weekStr) { localStorage.setItem('currentWeek', weekStr); localStorage.setItem('tripWeek', '0'); }
            if(localStorage.getItem('currentMonth') !== monthStr) { localStorage.setItem('currentMonth', monthStr); localStorage.setItem('tripMonth', '0'); }
        }

        function updateTripUI() {
            document.getElementById('valDay').innerText = (parseFloat(localStorage.getItem('tripDay') || 0)).toFixed(1);
            document.getElementById('valWeek').innerText = (parseFloat(localStorage.getItem('tripWeek') || 0)).toFixed(1);
            document.getElementById('valMonth').innerText = (parseFloat(localStorage.getItem('tripMonth') || 0)).toFixed(1);
        }

        function processTripDistance(currentServiceKm) {
            if(lastServiceKm === null) { lastServiceKm = currentServiceKm; return; }
            if(currentServiceKm < lastServiceKm) {
                let diff = lastServiceKm - currentServiceKm;
                if(diff > 0 && diff < 50) { 
                    checkTripDates();
                    let d = parseFloat(localStorage.getItem('tripDay') || 0) + diff;
                    let w = parseFloat(localStorage.getItem('tripWeek') || 0) + diff;
                    let m = parseFloat(localStorage.getItem('tripMonth') || 0) + diff;
                    
                    localStorage.setItem('tripDay', d); localStorage.setItem('tripWeek', w); localStorage.setItem('tripMonth', m);
                    updateTripUI();
                }
            }
            lastServiceKm = currentServiceKm;
        }

        window.onload = () => { checkTripDates(); updateTripUI(); };

        // BLE Logic
        async function processQueue() {
            if (isWriting || commandQueue.length === 0 || !rxChar) return;
            isWriting = true; let c = commandQueue.shift();
            try { await rxChar.writeValue(new TextEncoder().encode(c)); } catch (err) {}
            isWriting = false;
            if (commandQueue.length > 0) processQueue();
        }
        
        function sendCommand(c) { if (commandQueue[commandQueue.length - 1] !== c) { commandQueue.push(c); processQueue(); } }

        function toggleIgnition() {
            const card = document.getElementById('ignCard');
            isIgnitionOn = !isIgnitionOn;
            sendCommand(isIgnitionOn ? 'I' : 'i');
            card.classList.toggle('active-ignition', isIgnitionOn);
            if(!isIgnitionOn) { 
                stopEcoTimer(); hasRiddenSession = false; 
                const lightCard = document.getElementById('lightCard');
                if (lightCard.classList.contains('active-lights')) { lightCard.classList.remove('active-lights'); sendCommand('l'); }
            }
        }
        
        function toggleLights() { if(!isIgnitionOn) return; const card = document.getElementById('lightCard'); let on = card.classList.toggle('active-lights'); sendCommand(on ? 'L' : 'l'); }
        
        function handleHold(cmd, cls, down) { 
            const btn = event.currentTarget; 
            if (down) { if (isIgnitionOn) { sendCommand(cmd); btn.classList.add(cls); } } 
            else { sendCommand(cmd); btn.classList.remove(cls); } 
        }

        function toggleEcoMode() {
            isEcoMode = !isEcoMode; const btn = document.getElementById('ecoBtn');
            btn.innerText = isEcoMode ? "ECO ON" : "ECO OFF"; btn.classList.toggle('active', isEcoMode);
            sendCommand(isEcoMode ? 'E' : 'e'); if (!isEcoMode) stopEcoTimer();
        }

        function toggleAlarm() {
            isAlarmArmed = !isAlarmArmed; const btn = document.getElementById('alarmBtn');
            if (isAlarmArmed) { btn.innerText = "ALARM ON"; btn.classList.add('active'); sendCommand('A'); } 
            else { btn.innerText = "ALARM OFF"; btn.classList.remove('active'); sendCommand('a'); }
        }

        function resetService() {
            if(confirm("Are you sure you want to reset the Service Interval to 3000 KM?")) {
                sendCommand('R'); 
                document.getElementById('serviceVal').innerText = "3000"; document.getElementById('serviceBar').style.width = "100%";
                document.getElementById('serviceVal').style.color = "white"; document.getElementById('serviceBar').style.background = "var(--accent-cyan)";
                document.getElementById('serviceBar').style.boxShadow = "0 0 12px var(--accent-cyan)";
                window.notifiedOil = false; lastServiceKm = 3000; 
            }
        }

        function startEcoTimer() {
            if (ecoTimerInterval) return; countdown = 10; ecoTimerDisplay.innerText = countdown; ecoWarning.classList.add('show');
            ecoTimerInterval = setInterval(() => {
                countdown--; ecoTimerDisplay.innerText = countdown;
                if (countdown <= 0) { stopEcoTimer(); ecoTimerDisplay.innerText = "KILLED"; sendCommand('i'); document.getElementById('ignCard').classList.remove('active-ignition'); isIgnitionOn = false; }
            }, 1000);
        }

        function stopEcoTimer() { if (ecoTimerInterval) { clearInterval(ecoTimerInterval); ecoTimerInterval = null; ecoWarning.classList.remove('show'); } }

        async function connectBluetooth() {
            try {
                debugStr.innerText = "SYS: REQUESTING DEVICE...";
                if (!bleDevice) { bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Avenger_Custom' }], optionalServices: [serviceUuid] }); bleDevice.addEventListener('gattserverdisconnected', onDisconnected); }
                debugStr.innerText = "SYS: CONNECTING...";
                const server = await bleDevice.gatt.connect(); const service = await server.getPrimaryService(serviceUuid);
                rxChar = await service.getCharacteristic(rxUuid); const txChar = await service.getCharacteristic(txUuid);
                await txChar.startNotifications(); txChar.addEventListener('characteristicvaluechanged', handleIncomingData);
                statusPill.innerText = "ONLINE"; statusPill.className = "status-pill online"; connectBtn.style.display = "none"; debugStr.innerText = "SYS: CONNECTED.";
            } catch (err) { 
                debugStr.innerText = "ERR: " + err.message; statusPill.innerText = "OFFLINE"; statusPill.className = "status-pill"; connectBtn.style.display = "block";
            }
        }

        function onDisconnected() {
            statusPill.innerText = "RECONNECTING..."; statusPill.className = "status-pill"; debugStr.innerText = "SYS: CONNECTION LOST. ATTEMPTING RECONNECT...";
            setTimeout(() => { if (bleDevice && !bleDevice.gatt.connected) connectBluetooth(); }, 2000);
        }

        function handleIncomingData(event) {
            let value = event.target.value;
            for (let i = 0; i < value.byteLength; i++) { dataBuffer += String.fromCharCode(value.getUint8(i)); }
            if (dataBuffer.length > 50) dataBuffer = "";

            let parts = dataBuffer.split(',');
            if (parts.length >= 4 && (dataBuffer.endsWith('\n') || dataBuffer.endsWith('\r'))) {
                
                // 1. Service & Trips
                let kmRemaining = parseFloat(parts[0]);
                if (!isNaN(kmRemaining)) {
                    processTripDistance(kmRemaining);
                    let displayKm = kmRemaining < 0 ? 0 : Math.round(kmRemaining);
                    document.getElementById('serviceVal').innerText = displayKm;
                    let percent = Math.max((displayKm / 3000) * 100, 0);
                    document.getElementById('serviceBar').style.width = percent + "%";
                    
                    if (kmRemaining <= 0) {
                        document.getElementById('serviceVal').style.color = "var(--danger)"; document.getElementById('serviceBar').style.background = "var(--danger)"; document.getElementById('serviceBar').style.boxShadow = "0 0 15px var(--danger)";
                        if(!window.notifiedOil) { alert("⚠️ MAINTENANCE ALERT: Engine oil change needed!"); window.notifiedOil = true; }
                    } else {
                        document.getElementById('serviceVal').style.color = "white"; document.getElementById('serviceBar').style.background = "var(--accent-cyan)"; document.getElementById('serviceBar').style.boxShadow = "0 0 12px var(--accent-cyan)"; window.notifiedOil = false;
                    }
                }

                // 2. Temperature
                let tempNum = parseFloat(parts[1]);
                let tElem = document.getElementById('tempDigit'); let tBar = document.getElementById('tempBar');
                if (isNaN(tempNum) || tempNum <= 0) { tElem.textContent = "NO SENSOR"; tElem.style.fontSize = "16px"; tElem.style.color = "var(--danger)"; tBar.style.width = "0%"; } 
                else {
                    tElem.style.fontSize = "28px"; 
                    if (tempNum < 35) { tElem.textContent = "COLD"; tElem.style.color = "var(--accent-blue)"; tBar.style.background = "var(--accent-blue)"; tBar.style.width = "0%"; } 
                    else {
                        tElem.textContent = Math.round(tempNum);
                        let p = Math.min(Math.max((tempNum - 35) / 65, 0), 1) * 100; tBar.style.width = p + "%";
                        if (tempNum > 100) { tElem.style.color = "var(--danger)"; tBar.style.background = "var(--danger)"; } else { tElem.style.color = "white"; tBar.style.background = "white"; }
                    }
                }

                // 3. Gear / Neutral
                let gearStr = parts[2].replace(/[^A-Za-z0-9-]/g, '');
                let gearDisplay = document.getElementById('gearVal'); gearDisplay.innerText = gearStr;
                if (gearStr === "N") { gearDisplay.classList.add('neutral'); if (isEcoMode && isIgnitionOn && hasRiddenSession) startEcoTimer(); } 
                else { gearDisplay.classList.remove('neutral'); hasRiddenSession = true; stopEcoTimer(); }

                // 4. NEW: Battery Voltage
                let battVolts = parseFloat(parts[3]);
                let bElem = document.getElementById('battDigit');
                let bBar = document.getElementById('battBar');
                
                if (!isNaN(battVolts)) {
                    bElem.textContent = battVolts.toFixed(1);
                    // Calculate percentage fill based on 9V to 14.4V range
                    let battPercent = Math.min(Math.max((battVolts - 9.0) / 5.5, 0), 1) * 100; 
                    bBar.style.width = battPercent + "%";
                    
                    if (battVolts >= 13.5) { // Charging
                        bElem.parentElement.style.color = "var(--success)"; 
                        bBar.style.background = "var(--success)";
                        bBar.style.boxShadow = "0 0 12px var(--success)";
                    } 
                    else if (battVolts >= 11.5) { // Healthy Parked
                        bElem.parentElement.style.color = "var(--accent-blue)"; 
                        bBar.style.background = "var(--accent-blue)";
                        bBar.style.boxShadow = "0 0 12px var(--accent-blue)";
                    } 
                    else { // Dangerously Low / Starter Cranking
                        bElem.parentElement.style.color = "var(--danger)"; 
                        bBar.style.background = "var(--danger)";
                        bBar.style.boxShadow = "0 0 15px var(--danger)";
                    }
                }

                debugStr.innerText = "SYS: OK | " + kmRemaining.toFixed(1) + "KM | " + tempNum + "°C | " + gearStr + " | " + battVolts.toFixed(1) + "V";
                dataBuffer = "";
            }
        }

        connectBtn.addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
