<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avenger OS Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #020406; --glass-bg: rgba(255, 255, 255, 0.02); --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff; --accent-blue: #0066ff; --danger: #ff2a2a; --success: #00ff88;
            --warning: #ffcc00; --text-main: #ffffff; --text-muted: #5a6b84;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0a121e 0%, var(--bg-dark) 100%);
            color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 15px;
            min-height: 100vh; display: flex; justify-content: center; user-select: none;
        }

        .app-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 15px; }

        .header-row { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; letter-spacing: 2px; margin: 0; }
        h1 span { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan); }
        .status-pill { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 6px 14px; border-radius: 30px; font-size: 11px; font-weight: 800; }
        .status-pill.online { color: var(--success); box-shadow: 0 0 15px rgba(0,255,136,0.2); }

        .center-dash {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 25px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        
        .gear-display { font-family: 'Orbitron'; font-size: 80px; font-weight: 900; line-height: 1; color: var(--text-muted); transition: 0.3s; }
        .gear-display.neutral { color: var(--success); text-shadow: 0 0 30px rgba(0,255,136,0.5); }
        .gear-label { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; font-weight: 800; margin-top: 5px; }
        
        /* Badges for Alarm and Eco */
        .badge-btn {
            position: absolute; top: 15px; border: 1px solid var(--glass-border);
            padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        #ecoBtn { right: 15px; }
        #ecoBtn.active { background: rgba(0,255,136,0.1); border-color: var(--success); color: var(--success); box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        
        #alarmBtn { left: 15px; }
        #alarmBtn.active { background: rgba(255,42,42,0.1); border-color: var(--danger); color: var(--danger); box-shadow: 0 0 15px rgba(255,42,42,0.3); }

        .eco-warning-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,42,42,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.2s; z-index: 10;
        }
        .eco-warning-overlay.show { opacity: 1; pointer-events: all; }
        .eco-timer { font-family: 'Orbitron'; font-size: 60px; font-weight: 900; color: #fff; }
        .eco-warning-text { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #000; }

        .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; justify-content: center;}
        .label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .readout { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #fff; margin: 8px 0; }
        .unit { font-size: 11px; color: var(--accent-cyan); }
        .progress-track { background: #000; height: 4px; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .progress-fill { background: var(--accent-cyan); height: 100%; width: 100%; transition: 1s; box-shadow: 0 0 10px var(--accent-cyan); }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 5px; }
        .control-btn { background: rgba(255,255,255,0.01); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px 0; display: flex; justify-content: center; align-items: center; transition: 0.3s; cursor: pointer; }
        .control-btn i { font-size: 24px; color: #2a3544; } 
        .active-ignition { border-color: var(--success); } .active-ignition i { color: var(--success); text-shadow: 0 0 12px var(--success); }
        .active-lights { border-color: var(--accent-cyan); } .active-lights i { color: var(--accent-cyan); text-shadow: 0 0 12px var(--accent-cyan); }
        .active-start { border-color: var(--danger); } .active-start i { color: #fff; text-shadow: 0 0 12px var(--danger); }
        .active-horn { border-color: var(--warning); } .active-horn i { color: #fff; text-shadow: 0 0 12px var(--warning); }

        .connect-btn { width: 100%; padding: 15px; background: #111; border: 1px solid var(--glass-border); color: #fff; border-radius: 18px; cursor: pointer; font-family: 'Orbitron'; font-size: 14px; letter-spacing: 1px; }
        .debug-console { text-align: center; font-family: monospace; font-size: 10px; color: var(--warning); min-height: 15px; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-row">
            <h1>AVENGER<span>.OS</span></h1>
            <div id="statusPill" class="status-pill">OFFLINE</div>
        </div>

        <div class="center-dash">
            <div id="alarmBtn" class="badge-btn" onclick="toggleAlarm()">ALARM OFF</div>
            <div id="ecoBtn" class="badge-btn" onclick="toggleEcoMode()">ECO OFF</div>
            
            <div id="gearVal" class="gear-display">-</div>
            <div class="gear-label">GEAR POSITION</div>
            
            <div id="ecoWarning" class="eco-warning-overlay">
                <div class="eco-warning-text">AUTO-STOP IN</div>
                <div id="ecoTimerDisplay" class="eco-timer">10</div>
            </div>
        </div>

        <div class="dash-row">
            <div class="glass-panel">
                <div class="label">
                    <span>SERVICE DUE</span>
                    <i class="fa-solid fa-rotate-right" onclick="resetService()" style="cursor:pointer; color: var(--accent-cyan); font-size: 14px; padding: 5px;"></i>
                </div>
                <div class="readout"><span id="serviceVal">---</span> <span class="unit">KM</span></div>
                <div class="progress-track"><div class="progress-fill" id="serviceBar"></div></div>
            </div>
            <div class="glass-panel">
                <div class="label">ENGINE TEMP</div>
                <div class="readout" style="color:var(--accent-blue)"><span id="tempDigit">--</span> <span class="unit">°C</span></div>
                <div class="progress-track"><div class="progress-fill" id="tempBar" style="background:var(--accent-blue); width:0%;"></div></div>
            </div>
        </div>

        <button id="connectBtn" class="connect-btn">INITIALIZE LINK</button>
        <div id="debugStr" class="debug-console">SYS: STANDBY</div>

        <div class="controls-grid">
            <div class="control-btn" id="ignCard" onclick="toggleIgnition()"><i class="fa-solid fa-key"></i></div>
            <div class="control-btn" id="lightCard" onclick="toggleLights()"><i class="fa-solid fa-lightbulb"></i></div>
            <div class="control-btn" onmousedown="handleHold('H','active-start',true)" onmouseup="handleHold('h','active-start',false)" ontouchstart="handleHold('H','active-start',true); event.preventDefault();" ontouchend="handleHold('h','active-start',false); event.preventDefault();"><i class="fa-solid fa-bolt"></i></div>
            <div class="control-btn" onmousedown="handleHold('S','active-horn',true)" onmouseup="handleHold('s','active-horn',false)" ontouchstart="handleHold('S','active-horn',true); event.preventDefault();" ontouchend="handleHold('s','active-horn',false); event.preventDefault();"><i class="fa-solid fa-volume-high"></i></div>
        </div>
    </div>

    <script>
        const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const rxUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const txUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a9";
        
        let bleDevice, rxChar, isIgnitionOn = false;
        let isWriting = false, commandQueue = [];
        let dataBuffer = "";

        // ECO & ALARM STATE
        let isEcoMode = false;
        let ecoTimerInterval = null;
        let countdown = 10;
        let hasRiddenSession = false; 
        let isAlarmArmed = false;

        const connectBtn = document.getElementById('connectBtn');
        const statusPill = document.getElementById('statusPill');
        const debugStr = document.getElementById('debugStr');
        const ecoWarning = document.getElementById('ecoWarning');
        const ecoTimerDisplay = document.getElementById('ecoTimerDisplay');

        async function processQueue() {
            if (isWriting || commandQueue.length === 0 || !rxChar) return;
            isWriting = true;
            let c = commandQueue.shift();
            try { await rxChar.writeValue(new TextEncoder().encode(c)); } catch (err) {}
            isWriting = false;
            if (commandQueue.length > 0) processQueue();
        }
        
        function sendCommand(c) {
            if (commandQueue[commandQueue.length - 1] !== c) { commandQueue.push(c); processQueue(); }
        }

        // --- BUTTON LOGIC ---

        function toggleIgnition() {
            const card = document.getElementById('ignCard');
            isIgnitionOn = !isIgnitionOn;
            sendCommand(isIgnitionOn ? 'I' : 'i');
            card.classList.toggle('active-ignition', isIgnitionOn);
            
            if(!isIgnitionOn) { 
                stopEcoTimer(); 
                hasRiddenSession = false; // Reset warm-up memory
            }
        }
        
        function toggleLights() { if(!isIgnitionOn) return; const card = document.getElementById('lightCard'); let on = card.classList.toggle('active-lights'); sendCommand(on ? 'L' : 'l'); }
        function handleHold(cmd, cls, down) { const btn = event.currentTarget; if (down) { if (isIgnitionOn || cmd === 'S') { sendCommand(cmd); btn.classList.add(cls); } } else { sendCommand(cmd); btn.classList.remove(cls); } }

        function toggleEcoMode() {
            isEcoMode = !isEcoMode;
            const btn = document.getElementById('ecoBtn');
            btn.innerText = isEcoMode ? "ECO ON" : "ECO OFF";
            btn.classList.toggle('active', isEcoMode);
            if (!isEcoMode) stopEcoTimer();
        }

        function toggleAlarm() {
            isAlarmArmed = !isAlarmArmed;
            const btn = document.getElementById('alarmBtn');
            if (isAlarmArmed) {
                btn.innerText = "ALARM ON";
                btn.classList.add('active');
                sendCommand('A'); 
            } else {
                btn.innerText = "ALARM OFF";
                btn.classList.remove('active');
                sendCommand('a'); 
            }
        }

        function resetService() {
            if(confirm("Are you sure you want to reset the Service Interval to 3000 KM?")) {
                sendCommand('R'); 
                document.getElementById('serviceVal').innerText = "3000";
                document.getElementById('serviceBar').style.width = "100%";
            }
        }

        // --- ECO TIMER LOGIC ---

        function startEcoTimer() {
            if (ecoTimerInterval) return; 
            countdown = 10;
            ecoTimerDisplay.innerText = countdown;
            ecoWarning.classList.add('show');

            ecoTimerInterval = setInterval(() => {
                countdown--;
                ecoTimerDisplay.innerText = countdown;
                if (countdown <= 0) {
                    stopEcoTimer();
                    ecoTimerDisplay.innerText = "KILLED";
                    sendCommand('i'); 
                    document.getElementById('ignCard').classList.remove('active-ignition');
                    isIgnitionOn = false;
                }
            }, 1000);
        }

        function stopEcoTimer() {
            if (ecoTimerInterval) {
                clearInterval(ecoTimerInterval);
                ecoTimerInterval = null;
                ecoWarning.classList.remove('show');
            }
        }

        // --- BLUETOOTH CONNECTION ---

        connectBtn.addEventListener('click', async () => {
            try {
                debugStr.innerText = "SYS: REQUESTING DEVICE...";
                bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Avenger_Custom' }], optionalServices: [serviceUuid] });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(serviceUuid);
                rxChar = await service.getCharacteristic(rxUuid);
                const txChar = await service.getCharacteristic(txUuid);
                await txChar.startNotifications();
                
                txChar.addEventListener('characteristicvaluechanged', (event) => {
                    let value = event.target.value;
                    for (let i = 0; i < value.byteLength; i++) {
                        dataBuffer += String.fromCharCode(value.getUint8(i));
                    }
                    if (dataBuffer.length > 50) dataBuffer = "";

                    let parts = dataBuffer.split(',');
                    if (parts.length >= 3 && (dataBuffer.endsWith('\n') || dataBuffer.endsWith('\r'))) {
                        
                        // 1. Odometer
                        let km = parseInt(parts[0].replace(/[^0-9]/g, ''));
                        if (!isNaN(km)) {
                            document.getElementById('serviceVal').innerText = km;
                            document.getElementById('serviceBar').style.width = Math.min((km/3000)*100, 100) + "%";
                        }

                        // 2. Temp
                        let tempNum = parseFloat(parts[1].replace(/[^0-9.-]/g, ''));
                        if (!isNaN(tempNum)) {
                            let tElem = document.getElementById('tempDigit');
                            let tBar = document.getElementById('tempBar');
                            if (tempNum < 35) {
                                tElem.textContent = "COLD"; tElem.style.color = "var(--accent-blue)";
                                tBar.style.background = "var(--accent-blue)"; tBar.style.width = "0%";
                            } else {
                                tElem.textContent = Math.round(tempNum);
                                let p = Math.min(Math.max((tempNum - 35) / 65, 0), 1) * 100;
                                tBar.style.width = p + "%";
                                if (tempNum > 100) { tElem.style.color = "var(--danger)"; tBar.style.background = "var(--danger)"; }
                                else { tElem.style.color = "white"; tBar.style.background = "white"; }
                            }
                        }

                        // 3. Gear & Eco Logic
                        let gearStr = parts[2].replace(/[^A-Za-z0-9-]/g, '');
                        let gearDisplay = document.getElementById('gearVal');
                        gearDisplay.innerText = gearStr;
                        
                        if (gearStr === "N") {
                            gearDisplay.classList.add('neutral');
                            if (isEcoMode && isIgnitionOn && hasRiddenSession) {
                                startEcoTimer();
                            }
                        } else {
                            gearDisplay.classList.remove('neutral');
                            hasRiddenSession = true; 
                            stopEcoTimer(); 
                        }

                        debugStr.innerText = "SYS: OK | " + km + "KM | " + tempNum + "°C | " + gearStr;
                        dataBuffer = "";
                    }
                });

                statusPill.innerText = "ONLINE"; statusPill.className = "status-pill online";
                connectBtn.style.display = "none";
                debugStr.innerText = "SYS: CONNECTED.";
            } catch (err) { debugStr.innerText = "ERR: " + err.message; }
        });
    </script>
</body>
</html>
